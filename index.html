<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seberapa Kenal Kamu Sama Aku?</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #ffd6e7, #d9e7ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #ff4f91;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffd0df;
            border-radius: 12px;
            outline: none;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #ff5c9a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff397f;
        }

        .question {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .option {
            background: #f7f7f7;
            border: 2px solid #eee;
            padding: 13px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #ffe8f0;
            border-color: #ff80ad;
        }

        .progress {
            text-align: center;
            color: #ff4f91;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .result {
            text-align: center;
        }

        .score {
            font-size: 45px;
            font-weight: bold;
            color: #ff4f91;
            margin: 20px 0;
        }

        .result-text {
            font-size: 17px;
            line-height: 1.6;
            color: #555;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HALAMAN AWAL -->
    <div id="startPage">

        <h1>Seberapa Kenal Kamu Sama Aku?</h1>

        <p class="subtitle">
            Jawab 20 pertanyaan dan lihat seberapa kenal kamu sama aku 👀
        </p>

        <input 
            type="text" 
            id="nama"
            placeholder="Masukkan nama kamu..."
        >

        <button onclick="mulaiQuiz()">
            MULAI KUIS
        </button>

    </div>


    <!-- HALAMAN QUIZ -->
    <div id="quizPage" class="hidden">

        <div class="progress" id="progress"></div>

        <div class="question" id="question"></div>

        <div id="options"></div>

    </div>


    <!-- HALAMAN HASIL -->
    <div id="resultPage" class="hidden">

        <div class="result">

            <h1>Hasil Kuis 🎉</h1>

            <p id="hasilNama"></p>

            <div class="score" id="score"></div>

            <h2 id="kategori"></h2>

            <p class="result-text" id="pesan"></p>

            <button onclick="location.reload()">
                MAIN LAGI
            </button>

        </div>

    </div>

</div>

        ],
        benar: 0
    }

];


let nomor = 0;
let skor = 0;
let nama = "";


function mulaiQuiz() {

    nama = document.getElementById("nama").value;

    if (nama.trim() === "") {
        alert("Masukkan nama kamu dulu ya!");
        return;
    }

    document.getElementById("startPage").classList.add("hidden");

    document.getElementById("quizPage").classList.remove("hidden");

    tampilkanSoal();

}


function tampilkanSoal() {

    const soal = pertanyaan[nomor];

    document.getElementById("progress").innerText =
        "Pertanyaan " + (nomor + 1) + " dari " + pertanyaan.length;

    document.getElementById("question").innerText =
        soal.soal;

    const options = document.getElementById("options");

    options.innerHTML = "";

    soal.pilihan.forEach((pilihan, index) => {

        const div = document.createElement("div");

        div.className = "option";

        div.innerText =
            String.fromCharCode(65 + index) + ". " + pilihan;

        div.onclick = function() {
            jawab(index);
        };

        options.appendChild(div);

    });

}


function jawab(jawaban) {

    if (jawaban === pertanyaan[nomor].benar) {
        skor += 5;
    }

    nomor++;

    if (nomor < pertanyaan.length) {

        tampilkanSoal();

    } else {

        tampilkanHasil();

    }

}


function tampilkanHasil() {

    document.getElementById("quizPage").classList.add("hidden");

    document.getElementById("resultPage").classList.remove("hidden");

    document.getElementById("hasilNama").innerText =
        "Hasil untuk " + nama;

    document.getElementById("score").innerText =
        skor + "/100";


    if (skor >= 90) {

        document.getElementById("kategori").innerText =
            "BESTIE SEJATI 🫵🏻💗";

        document.getElementById("pesan").innerText =
            "Gila, kamu beneran kenal aku! Kamu bukan cuma tahu namaku, tapi juga tahu sifat dan kebiasaanku.";

    }

    else if (skor >= 70) {

        document.getElementById("kategori").innerText =
            "TEMAN DEKAT 💗";

        document.getElementById("pesan").innerText =
            "Lumayan banget! Berarti selama ini kamu cukup memperhatikan aku.";

    }

    else if (skor >= 50) {

        document.getElementById("kategori").innerText =
            "KITA TEMEN KAN? 🤨";

        document.getElementById("pesan").innerText =
            "Kamu tahu beberapa hal tentang aku, tapi ternyata masih banyak yang belum kamu tahu.";

    }

    else {

        document.getElementById("kategori").innerText =
            "TEMAN PALSU TERDETEKSI 🚨";

        document.getElementById("pesan").innerText =
            "Selama ini kamu ngobrol sama aku tapi ternyata belum benar-benar mengenalku 😭";

    }

}

</script>
